<!DOCTYPE html>
<html>
<head>
  <title>Vincenzo Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase (compat version for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; background:#f5f5f5; padding:10px; }
    input, textarea { width:95%; padding:10px; margin:5px 0; }
    button { width:100%; padding:10px; margin:5px 0; cursor:pointer; }
    .box { background:white; padding:10px; margin:10px 0; border-radius:10px; }
    .card {
      border:1px solid #ddd;
      border-radius:10px;
      padding:10px;
      margin:10px;
      display:inline-block;
      width:220px;
      text-align:center;
      background:white;
    }
    .card img { width:150px; height:150px; border-radius:10px; }
    #adminPanel { display:none; }
  </style>
</head>

<body>

<h1>🚀 VINCENZO HUB</h1>

<!-- 🔐 AUTH -->
<div class="box">
<h2>🔐 Login / Signup</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
</div>

<!-- 💳 PAYMENT -->
<div class="box">
<h2>🎁 Gift Club Membership</h2>
<p>Jiunge kupata offers na discounts</p>

<p>💰 Ada: <b>TSh 15,000</b></p>

<h3>📱 Halopesa</h3>
<p>📞 0618779588</p>

<p>Baada ya kulipa subiri approval ya admin.</p>
</div>

<!-- 👨‍💻 ADMIN PANEL -->
<div class="box" id="adminPanel">

<h2>👨‍💻 Admin Panel</h2>

<h3>➕ Add Product</h3>
<input id="pname" placeholder="Product Name">
<input id="pprice" placeholder="Price">
<input id="pcat" placeholder="Category">
<input id="pimg" placeholder="Image URL">
<button onclick="addProduct()">Add Product</button>

<h3>📰 Add News</h3>
<input id="ntitle" placeholder="News Title">
<textarea id="ncontent" placeholder="News Content"></textarea>
<button onclick="addNews()">Add News</button>

<h3>🎁 Approve Membership</h3>
<input id="approveEmail" placeholder="User Email">
<button onclick="approveMember()">Approve Member</button>

</div>

<!-- 🛒 PRODUCTS -->
<div class="box">
<h2>🛒 Products</h2>
<div id="products"></div>
</div>

<!-- 📰 NEWS -->
<div class="box">
<h2>📰 News</h2>
<div id="news"></div>
</div>

<script>
/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBJwcABL0q4clpRwxWXHGlB6d0sSRnsq_Y",
  authDomain: "vincenzo-hub.firebaseapp.com",
  projectId: "vincenzo-hub",
  storageBucket: "vincenzo-hub.firebasestorage.app",
  messagingSenderId: "499010425304",
  appId: "1:499010425304:web:fa022bd768ccb6854f62ad"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let isAdmin = false;

/* 🔐 SIGNUP */
function signup(){
  auth.createUserWithEmailAndPassword(email.value, password.value)
  .then(()=> alert("Account created 🔥"))
  .catch(e=> alert(e.message));
}

/* 🔐 LOGIN + ROLE CHECK */
function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(async (res)=>{

    currentUser = res.user;

    let doc = await db.collection("users").doc(currentUser.uid).get();

    if(doc.exists && doc.data().role === "admin"){
      isAdmin = true;
      adminPanel.style.display = "block";
      alert("Welcome Admin 🔥");
    } else {
      isAdmin = false;
      adminPanel.style.display = "none";
      alert("Login success 🔥");
    }

  })
  .catch(e=> alert(e.message));
}

/* 🛒 DEFAULT PRODUCTS */
const productsData = [
  {name:"iPhone 15 Pro Max", price:2000000, cat:"iPhone", img:"https://via.placeholder.com/200?text=iPhone+15+Pro+Max"},
  {name:"Samsung S24 Ultra", price:2000000, cat:"Samsung", img:"https://via.placeholder.com/200?text=Samsung+S24+Ultra"},
  {name:"Infinix Note 40", price:400000, cat:"Infinix", img:"https://via.placeholder.com/200?text=Infinix+Note+40"}
];

function loadProducts(){
  let html="";
  productsData.forEach(p=>{
    html+=`
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p>${p.cat}</p>
        <b>${p.price.toLocaleString()} TSh</b>
        <button>Order Now</button>
      </div>
    `;
  });
  products.innerHTML = html;
}
loadProducts();

/* 📰 NEWS */
function loadNews(){
  db.collection("news").onSnapshot(snap=>{
    let html="";
    snap.forEach(d=>{
      let n=d.data();
      html+=`<div class="box"><b>${n.title}</b><br>${n.content}</div>`;
    });
    news.innerHTML = html;
  });
}

/* ➕ ADD PRODUCT */
function addProduct(){
  db.collection("products").add({
    name:pname.value,
    price:pprice.value,
    category:pcat.value,
    img:pimg.value
  });
  alert("Product added 🔥");
}

/* ➕ ADD NEWS */
function addNews(){
  db.collection("news").add({
    title:ntitle.value,
    content:ncontent.value
  });
  alert("News added 🔥");
}

/* 🎁 APPROVE MEMBER */
function approveMember(){
  db.collection("users").doc(approveEmail.value).set({
    role:"member",
    status:"approved"
  });
  alert("Member approved 🔥");
}

loadNews();
</script>

</body>
</html>
